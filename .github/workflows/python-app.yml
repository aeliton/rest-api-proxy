name: unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install the project
      run: |
        uv sync --locked --all-extras --dev
    - name: Lint with flake8
      run: |
        uv run flake8 rest_api_proxy tests --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 rest_api_proxy tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        uv run python runtests.py
